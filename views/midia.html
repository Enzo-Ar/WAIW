<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- BACKEND: título da aba = nome da mídia carregada pelo id -->
  <title>WAIW</title>
  <meta name="description" content="Registro individual de uma mídia assistida.">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Mesmo CSS das outras páginas -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <!-- NAVBAR -->
  <header class="site-header">
    <div class="container">
      <nav class="navbar navbar-expand-md p-0">
        <a class="logo" href="/">
          <span class="logo-tape" aria-hidden="true"></span>
          WAIW
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Abrir menu">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="navMenu">
          <ul class="navbar-nav gap-md-4 gap-2 mt-3 mt-md-0">
            <li class="nav-item"><a class="nav-link" href="/categoria?tipo=series">Series</a></li>
            <li class="nav-item"><a class="nav-link" href="/categoria?tipo=filmes">Movies</a></li>
            <li class="nav-item"><a class="nav-link" href="/categoria?tipo=cartoons">Cartoons</a></li>
          </ul>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">

      <!-- BACKEND: "voltar" deve linkar pra categoria de origem (com o mesmo tipo desta mídia) -->
      <div class="pt-4">
        <a class="back-link" id="back-link"></a>
      </div>

      <!-- BACKEND: trilha conforme tipo + título da mídia carregada pelo id -->
      <ul class="breadcrumb-row">
        <li><a href="index.html">Início</a></li>
        <li class="breadcrumb-sep">/</li>
        <li><a id="type-breadcrumb"></a></li>
        <li class="breadcrumb-sep">/</li>
        <li class="is-current" id="isCurr"></li>
      </ul>
    </div>

    <!--
      IDENTIDADE DA MÍDIA
      BACKEND: esta seção inteira depende do tipo e do id recebidos.
      - .media-poster aceita os modificadores: (padrão = filme), media-poster--serie, media-poster--desenho
      - .media-badge aceita: badge-type--filme, badge-type--serie, badge-type--desenho
      - troque a letra do poster, o título, a nota, a data e as tags pelos dados reais do registro
    -->
    <section class="media-header">
      <div class="container">
        <div class="row g-4">
          <div class="col-lg-4">
            <div class="position-relative">
              <span class="media-poster__tape" aria-hidden="true"></span>
              <div class="media-poster" id="poster">
                <span id="badge"></span>
              </div>
            </div>
          </div>

          <div class="col-lg-8">
            <p class="media-kicker"></p>
            <h1 class="media-title" id="big-title"></h1>

            <div class="media-score" id="big-nota">
              <small>/5</small>
            </div>

            <ul class="tag-row media-tags" id="category-lister">
            </ul>

            <!-- BACKEND: ficha com os campos principais do registro -->
            <div class="ficha">
              <dl>
                <dt>Título</dt>
                <dd id="small-title"></dd>

                <dt>Tipo</dt>
                <dd id="type">Filme</dd>

                <dt>Lançado em:</dt>
                <dd id="date"></dd>

                <dt>Nota</dt>
                <dd id="small-nota"></dd>
              </dl>
            </div>
          </div>

        </div>
      </div>
    </section>

    <div class="hazard-divider" aria-hidden="true"></div>

    <!-- COMENTÁRIO -->
    <section class="review-section">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-9">
            <!-- BACKEND: texto completo do comentário salvo para esse registro -->
            <div class="review-block">
              <span class="review-block__quote" aria-hidden="true">"</span>
              <p class="review-block__text" id="review_text">
              </p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer" id="sobre">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-8">
          <p class="footer-text">WAIW - What Am I Watching, projeto simples e casual, feito para guardar memoria de filmes, series e cartoons/desenhos que vi ou estou vendo, já que eu nunca lembro deles.</p>
        </div>
        <div class="col-md-4 text-md-end">
          <span class="footer-tag">EST. 2026</span>
        </div>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/midia.js"></script>
</body>
</html>
