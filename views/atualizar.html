<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- BACKEND: título da aba = nome da mídia carregada pelo id -->
  <title>WAIW - registro</title>
  <meta name="description" content="Registro individual de uma mídia assistida.">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Mesmo CSS das outras páginas -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- NAVBAR -->
  <header class="site-header">
    <div class="container">
      <nav class="navbar navbar-expand-md p-0">
        <a class="logo" href="/">
          <span class="logo-tape" aria-hidden="true"></span>
          WAIW
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Abrir menu">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="navMenu">
          <ul class="navbar-nav gap-md-4 gap-2 mt-3 mt-md-0" id="navList">
            <li class="nav-item"><a class="nav-link" href="/categoria?tipo=series">Series</a></li>
            <li class="nav-item"><a class="nav-link" href="/categoria?tipo=filmes">Movies</a></li>
            <li class="nav-item"><a class="nav-link" href="/categoria?tipo=cartoons">Cartoons</a></li>
          </ul>
        </div>
      </nav>
    </div>
  </header>

  <main id="topo">
    <section class="entry-section">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-8">
            <div class="entry-card">
              <span class="entry-card__tape" aria-hidden="true"></span>
              <span class="d-flex">
                <h2 class="entry-card__title" id="novo"><a href="/registro">Novo registro</a></h2>
                <h2 class="entry-card__title ms-4" id="mod"><a>Atualizar registro</a></h2>
              </span>

              <form id="regForm">
                <div class="row g-2">
                    <div class="col-12 col-md-6">
                        <div class="col-12 h-100 d-flex flex-column" id="midia-show">
                            <label for="midias" class="form-label">Midias:</label>
                            <select name="midias" id="midias" class="form-select field flex-grow-1" size="10">
                            </select>
                        </div>
                    </div>
                
                    <div class="col-12 col-md-6 pt-5 pe-3 ps-3">
                        <div class="col-12 d-flex justify-content-between align-items-end">
                            <label class="form-label"><input type="radio" name="tipo" id="slc-filme" value="filmes" class="form-check-input" checked>Filme</label>
                            <label class="form-label"><input type="radio" name="tipo" id="slc-serie" value="series" class="form-check-input">Serie</label>
                            <label class="form-label"><input type="radio" name="tipo" id="slc-cartoon" value="cartoons" class="form-check-input">Cartoon</label>
                        </div>

                        <hr></hr>

                        <div class="col-12">
                            <label for="titulo" class="form-label">Título</label>
                            <input type="text" class="form-control field" id="titulo" name="titulo" placeholder="Nome do filme, série ou desenho">
                        </div>

                        <span class="d-flex justify-content-around" id="joiner">
                            <hr></hr>
                            <div class="col-3">
                                <label for="nota" class="form-label">Nota</label>
                                <input type="number" class="form-control field" id="nota" name="nota" placeholder="0-5" min="0" max="5" step="0.1">
                            </div>

                            <div class="col-6" id="div-data">
                                <label for="data" class="form-label">Lançado em:</label>
                                <input type="date" class="form-control field" id="data" name="data">
                            </div>
                            <hr id="theLine"></hr>
                        </span>

                        <div class="col-12" id="div-comentario">
                            <label for="comentario" class="form-label">Comentário</label>
                            <textarea class="form-control field" id="comentario" name="comentario" rows="3" placeholder="Escreva aqui"></textarea>
                        </div>

                        <div class="col-12" id="poster-text">
                            <label for="poster" class="form-label">Poster link:</label>
                            <textarea class="form-control field" id="poster" name="poster" rows="1" placeholder="Cole aqui"></textarea>
                        </div>
                    </div>

                    <div class="col-12">
                        <button type="submit" class="btn-save">Modificar registro</button>
                    </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer" id="sobre">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-8">
          <p class="footer-text">WAIW - What Am I Watching, projeto simples e casual, feito para guardar memoria de filmes, series e cartoons/desenhos que vi ou estou vendo, já que eu nunca lembro deles.</p>
        </div>
        <div class="col-md-4 text-md-end">
          <span class="footer-tag">EST. 2026</span>
        </div>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/atualizar.js"></script>
</body>
</html>
